<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121513" />
      <stop offset="100%" stop-color="#171D18" />
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A3E635" />
      <stop offset="100%" stop-color="#84CC16" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgGrad)" rx="20"/>
  <circle cx="300" cy="180" r="120" fill="#272E28" opacity="0.3"/>
  <circle cx="300" cy="180" r="90" fill="#A3E635" opacity="0.1"/>
  <!-- Dumbbell Icon -->
  <g transform="translate(180, 110)">
    <rect x="30" y="55" width="180" height="30" rx="10" fill="url(#limeGrad)"/>
    <rect x="0" y="25" width="40" height="90" rx="12" fill="#F4F4F5"/>
    <rect x="200" y="25" width="40" height="90" rx="12" fill="#F4F4F5"/>
    <rect x="15" y="10" width="20" height="120" rx="8" fill="#A3E635"/>
    <rect x="205" y="10" width="20" height="120" rx="8" fill="#A3E635"/>
  </g>
  <text x="300" y="310" text-anchor="middle" fill="#F4F4F5" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="bold">FIT HUB Training</text>
  <text x="300" y="340" text-anchor="middle" fill="#929B93" font-family="'Segoe UI', Roboto, sans-serif" font-size="16">Empower Your Daily Workout</text>
</svg>